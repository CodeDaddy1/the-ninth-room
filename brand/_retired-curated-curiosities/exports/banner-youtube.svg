  <!-- wordmark -->
  <text x="1280" y="800" text-anchor="middle" fill="#F4EFE6" font-size="88" letter-spacing="10">CURATED</text>
  <text x="1280" y="858" text-anchor="middle" fill="#E8A33D" font-family="'Trebuchet MS','Helvetica Neue',sans-serif" font-size="42" letter-spacing="18">CURIOSITIES</text>

  <!-- tagline -->
