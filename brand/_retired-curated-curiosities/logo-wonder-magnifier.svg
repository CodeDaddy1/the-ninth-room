    <rect x="712" y="1336" width="80" height="80" rx="8" fill="#E8A33D"/><text x="712" y="1434">#E8A33D</text>
    <rect x="804" y="1336" width="80" height="80" rx="8" fill="#F4EFE6"/><text x="804" y="1434">#F4EFE6</text>
    <rect x="896" y="1336" width="80" height="80" rx="8" fill="#6B7C93"/><text x="896" y="1434">#6B7C93</text>
