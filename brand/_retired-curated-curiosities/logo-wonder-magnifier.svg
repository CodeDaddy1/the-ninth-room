  <text x="620" y="1484" fill="#F4EFE6" font-size="24">Type</text>
  <text x="620" y="1512" fill="#6B7C93" font-family="'Trebuchet MS',sans-serif" font-size="14">High-contrast serif + spaced caps</text>
