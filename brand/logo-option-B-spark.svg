  <text x="540" y="566" text-anchor="middle" fill="#F2F4F3" font-size="50" font-weight="bold" letter-spacing="2">CURATED</text>
  <text x="540" y="614" text-anchor="middle" fill="#19E3C2" font-size="38" font-weight="bold" letter-spacing="6">CURIOSITIES</text>

  <!-- banner -->
  <text x="90" y="700" fill="#7A8079" font-size="18" letter-spacing="3">YOUTUBE BANNER · 2560 × 1440</text>
  <rect x="90" y="718" width="900" height="506" rx="14" fill="#0E0F11" stroke="#262A2E"/>
  <g fill="#19E3C2" fill-opacity="0.06">
    <circle cx="200" cy="800" r="5"/><circle cx="860" cy="1140" r="6"/><circle cx="820" cy="820" r="4"/>
  </g>
  <rect x="271" y="897" width="538" height="148" fill="none" stroke="#7A8079" stroke-opacity="0.5" stroke-dasharray="6 6"/>
  <text x="277" y="889" fill="#7A8079" font-size="12">title-safe area · 1546 × 423</text>
  <path d="M 540 905 C 540 935, 547 938, 577 943 C 547 948, 540 951, 540 981 C 540 951, 533 948, 503 943 C 533 938, 540 935, 540 905 Z" fill="#19E3C2"/>
  <text x="540" y="1014" text-anchor="middle" fill="#F2F4F3" font-size="32" font-weight="bold" letter-spacing="3">CURATED CURIOSITIES</text>
  <text x="540" y="1040" text-anchor="middle" fill="#19E3C2" font-size="15" letter-spacing="4">STAY CURIOUS</text>

  <!-- bottom row -->
  <line x1="90" y1="1268" x2="990" y2="1268" stroke="#262A2E" stroke-width="1.5"/>

  <!-- watermark -->
  <text x="90" y="1318" fill="#F2F4F3" font-size="24" font-weight="bold">WATERMARK</text>
  <text x="90" y="1342" fill="#7A8079" font-size="13">150 × 150 · video corner</text>
  <rect x="90" y="1360" width="300" height="169" rx="8" fill="#1E2226"/>
  <path d="M 228 1428 l 28 16 l -28 16 Z" fill="#F2F4F3" fill-opacity="0.14"/>
  <path d="M 356 1481 C 356 1492, 359 1493, 370 1495 C 359 1497, 356 1498, 356 1509 C 356 1498, 353 1497, 342 1495 C 353 1493, 356 1492, 356 1481 Z" fill="#19E3C2"/>
  <path d="M 452 1404 C 452 1424, 458 1426, 478 1430 C 458 1434, 452 1436, 452 1456 C 452 1436, 446 1434, 426 1430 C 446 1426, 452 1424, 452 1404 Z" fill="#19E3C2"/>

  <!-- palette -->
