<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1620" width="1080" height="1620" font-family="'Futura','Century Gothic','Gill Sans','Trebuchet MS',sans-serif">
  <defs>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#19E3C2" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#19E3C2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1620" fill="#15171A"/>
  <!-- atmosphere: scattered faint sparks -->
  <g fill="#19E3C2" fill-opacity="0.07">
    <circle cx="930" cy="150" r="6"/><circle cx="980" cy="240" r="3"/><circle cx="880" cy="250" r="4"/>
    <circle cx="150" cy="1180" r="4"/><circle cx="110" cy="1240" r="6"/>
  </g>

  <!-- header -->
  <text x="90" y="115" fill="#19E3C2" font-size="22" letter-spacing="8" font-weight="bold">OPTION B</text>
  <text x="86" y="200" fill="#F2F4F3" font-size="74" font-weight="bold" letter-spacing="-1">SPARK</text>
  <text x="90" y="246" fill="#7A8079" font-size="25">The moment curiosity ignites.</text>
  <line x1="90" y1="284" x2="990" y2="284" stroke="#262A2E" stroke-width="1.5"/>

  <!-- logo lockup -->
  <circle cx="540" cy="420" r="150" fill="url(#glowB)"/>
  <!-- main sparkle -->
  <path d="M 540 352 C 540 404, 552 408, 604 420 C 552 432, 540 436, 540 488 C 540 436, 528 432, 476 420 C 528 408, 540 404, 540 352 Z" fill="#19E3C2"/>
  <!-- secondary sparkle -->
