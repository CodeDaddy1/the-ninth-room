  <g font-size="12" fill="#7A8079">
    <rect x="620" y="1338" width="80" height="80" rx="8" fill="#15171A" stroke="#262A2E"/><text x="620" y="1436">#15171A</text>
    <rect x="712" y="1338" width="80" height="80" rx="8" fill="#19E3C2"/><text x="712" y="1436">#19E3C2</text>
    <rect x="804" y="1338" width="80" height="80" rx="8" fill="#FF6B4A"/><text x="804" y="1436">#FF6B4A</text>
    <rect x="896" y="1338" width="80" height="80" rx="8" fill="#F2F4F3"/><text x="896" y="1436">#F2F4F3</text>
  </g>
  <text x="620" y="1486" fill="#F2F4F3" font-size="24" font-weight="bold">TYPE</text>
  <text x="620" y="1514" fill="#7A8079" font-size="14">Bold geometric sans</text>
  <text x="620" y="1562" fill="#F2F4F3" font-size="44" font-weight="bold">Aa</text>
  <text x="690" y="1562" fill="#19E3C2" font-size="38" font-weight="bold" letter-spacing="2">CC</text>
</svg>
