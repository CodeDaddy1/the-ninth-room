<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4EFE6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F4EFE6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lensClip"><circle cx="175" cy="175" r="110"/></clipPath>
  </defs>

  <!-- faint wider starfield -->
  <g fill="#F4EFE6">
    <circle cx="60" cy="80" r="2.5" fill-opacity="0.28"/>
    <circle cx="320" cy="78" r="3" fill-opacity="0.28"/>
    <circle cx="60" cy="320" r="2.2" fill-opacity="0.22"/>
    <circle cx="340" cy="280" r="2.6" fill-opacity="0.24"/>
    <circle cx="44" cy="184" r="1.8" fill-opacity="0.2"/>
    <circle cx="300" cy="36" r="1.6" fill-opacity="0.18"/>
  </g>

  <!-- magnified constellation inside the lens -->
  <g clip-path="url(#lensClip)">
    <circle cx="149.8" cy="130.5" r="30" fill="url(#starGlow)"/>
    <circle cx="223.4" cy="194.4" r="34" fill="url(#amberGlow)"/>
    <polyline points="111,162 150,131 191,154 223,194 173,223 127,208" fill="none" stroke="#E8A33D" stroke-opacity="0.55" stroke-width="3.2"/>
    <circle cx="111.1" cy="161.5" r="5.8" fill="#F4EFE6"/>
    <circle cx="190.5" cy="153.7" r="7.7" fill="#F4EFE6"/>
    <circle cx="173.1" cy="223.4" r="6.8" fill="#F4EFE6"/>
    <circle cx="126.6" cy="207.9" r="5.8" fill="#F4EFE6"/>
    <path d="M149.8,115 C149.8,126.16 154.14,130.5 165.3,130.5 C154.14,130.5 149.8,134.84 149.8,146 C149.8,134.84 145.46,130.5 134.3,130.5 C145.46,130.5 149.8,126.16 149.8,115 Z" fill="#F4EFE6"/>
    <path d="M223.4,177 C223.4,189.53 228.27,194.4 240.8,194.4 C228.27,194.4 223.4,199.27 223.4,211.8 C223.4,199.27 218.53,194.4 206,194.4 C218.53,194.4 223.4,189.53 223.4,177 Z" fill="#E8A33D"/>
  </g>

  <!-- lens glass tint + highlight + ring + handle -->
  <circle cx="175" cy="175" r="108" fill="#F4EFE6" fill-opacity="0.03"/>
  <path d="M 110 130 A 88 88 0 0 1 175 100" fill="none" stroke="#F4EFE6" stroke-opacity="0.45" stroke-width="8" stroke-linecap="round"/>
  <circle cx="175" cy="175" r="120" fill="none" stroke="#F4EFE6" stroke-width="18"/>
  <line x1="260" y1="260" x2="340" y2="340" stroke="#F4EFE6" stroke-width="32" stroke-linecap="round"/>
</svg>
