<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1620" width="1080" height="1620" font-family="Georgia, 'Palatino Linotype', 'Times New Roman', serif">
  <defs>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1080" height="1620" fill="#0E1B2C"/>
  <!-- atmosphere: faint lens echoes -->
  <g fill="none" stroke="#E8A33D" stroke-opacity="0.06">
    <circle cx="900" cy="190" r="120"/><circle cx="900" cy="190" r="190"/><circle cx="900" cy="190" r="260"/>
  </g>

  <!-- header -->
  <text x="90" y="115" fill="#E8A33D" font-family="'Trebuchet MS',sans-serif" font-size="22" letter-spacing="7">OPTION A</text>
  <text x="88" y="195" fill="#F4EFE6" font-size="68">Aperture</text>
  <text x="90" y="244" fill="#6B7C93" font-size="25" font-style="italic">Look closer — we curate the rest.</text>
  <line x1="90" y1="282" x2="990" y2="282" stroke="#243449" stroke-width="1.5"/>

  <!-- logo lockup -->
  <circle cx="540" cy="430" r="150" fill="url(#glowA)"/>
  <g>
    <circle cx="540" cy="420" r="68" fill="none" stroke="#F4EFE6" stroke-width="9"/>
    <circle cx="540" cy="420" r="52" fill="none" stroke="#F4EFE6" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M 512 392 A 40 40 0 0 1 540 372" fill="none" stroke="#F4EFE6" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
    <line x1="588" y1="468" x2="624" y2="504" stroke="#F4EFE6" stroke-width="16" stroke-linecap="round"/>
    <circle cx="540" cy="420" r="15" fill="#E8A33D"/>
  </g>
  <text x="540" y="572" text-anchor="middle" fill="#F4EFE6" font-size="62">Curated</text>
  <text x="540" y="618" text-anchor="middle" fill="#E8A33D" font-family="'Trebuchet MS',sans-serif" font-size="30" letter-spacing="11">CURIOSITIES</text>

  <!-- banner -->
  <text x="90" y="700" fill="#6B7C93" font-family="'Trebuchet MS',sans-serif" font-size="18" letter-spacing="3">YOUTUBE BANNER · 2560 × 1440</text>
  <rect x="90" y="718" width="900" height="506" rx="14" fill="#0A1422" stroke="#243449"/>
  <g fill="none" stroke="#E8A33D" stroke-opacity="0.05">
    <circle cx="540" cy="971" r="120"/><circle cx="540" cy="971" r="200"/>
  </g>
  <rect x="271" y="897" width="538" height="148" fill="none" stroke="#6B7C93" stroke-opacity="0.5" stroke-dasharray="6 6"/>
  <text x="277" y="889" fill="#6B7C93" font-family="'Trebuchet MS',sans-serif" font-size="12">title-safe area · 1546 × 423</text>
  <g>
    <circle cx="540" cy="930" r="20" fill="none" stroke="#F4EFE6" stroke-width="3.5"/>
    <line x1="554" y1="944" x2="566" y2="956" stroke="#F4EFE6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="540" cy="930" r="5" fill="#E8A33D"/>
  </g>
  <text x="540" y="998" text-anchor="middle" fill="#F4EFE6" font-size="34" letter-spacing="4">CURATED CURIOSITIES</text>
  <text x="540" y="1028" text-anchor="middle" fill="#E8A33D" font-family="'Trebuchet MS',sans-serif" font-size="16" letter-spacing="3">CURIOSITY, CURATED.</text>

  <!-- bottom row -->
  <line x1="90" y1="1268" x2="990" y2="1268" stroke="#243449" stroke-width="1.5"/>

  <!-- watermark -->
  <text x="90" y="1318" fill="#F4EFE6" font-size="24">Watermark</text>
  <text x="90" y="1342" fill="#6B7C93" font-family="'Trebuchet MS',sans-serif" font-size="13">150 × 150 · video corner</text>
  <rect x="90" y="1360" width="300" height="169" rx="8" fill="#16273B"/>
  <path d="M 228 1428 l 28 16 l -28 16 Z" fill="#F4EFE6" fill-opacity="0.14"/>
  <g>
    <circle cx="356" cy="1495" r="16" fill="none" stroke="#F4EFE6" stroke-width="3"/>
    <line x1="367" y1="1506" x2="375" y2="1514" stroke="#F4EFE6" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="356" cy="1495" r="4" fill="#E8A33D"/>
  </g>
  <g transform="translate(452,1430)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#F4EFE6" stroke-width="5"/>
    <line x1="21" y1="21" x2="38" y2="38" stroke="#F4EFE6" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="7" fill="#E8A33D"/>
  </g>

  <!-- palette -->
  <text x="620" y="1318" fill="#F4EFE6" font-size="24">Palette</text>
  <g font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#6B7C93">
    <rect x="620" y="1338" width="80" height="80" rx="8" fill="#0E1B2C" stroke="#243449"/><text x="620" y="1436">#0E1B2C</text>
    <rect x="712" y="1338" width="80" height="80" rx="8" fill="#E8A33D"/><text x="712" y="1436">#E8A33D</text>
    <rect x="804" y="1338" width="80" height="80" rx="8" fill="#F4EFE6"/><text x="804" y="1436">#F4EFE6</text>
    <rect x="896" y="1338" width="80" height="80" rx="8" fill="#6B7C93"/><text x="896" y="1436">#6B7C93</text>
  </g>
  <text x="620" y="1486" fill="#F4EFE6" font-size="24">Type</text>
  <text x="620" y="1514" fill="#6B7C93" font-family="'Trebuchet MS',sans-serif" font-size="14">Editorial serif + letterspaced caps</text>
  <text x="620" y="1562" fill="#F4EFE6" font-size="44">Aa</text>
  <text x="690" y="1562" fill="#E8A33D" font-family="'Trebuchet MS',sans-serif" font-size="30" letter-spacing="4">CC</text>
</svg>
